    <script>
        var worksDataLoaded = false;
        var currentLang = localStorage.getItem('lang') || 'zh';

        function loadWorksData(callback){
            if(worksDataLoaded){
                callback();
                return;
            }
            var script = document.createElement("script");
            script.src = "works-data.js?" + Date.now();
            script.onload = function(){
                worksDataLoaded = true;
                callback();
            };
            script.onerror = function(){
                alert("数据加载失败，请稍后再试");
            };
            document.head.appendChild(script);
