<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>哔哩哔哩 UP 主数据</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
            color-scheme: light dark;
            --bg:#f5f6f8;
            --text:#2c3e50;
            --text-secondary:#6b7280;
            --text-muted:#9ca3af;
            --card-bg:#fff;
            --card-hover:#fafafa;
            --border:#f3f4f6;
            --border-strong:#e5e7eb;
            --header-from:#fb7299;
            --header-to:#ff8eb0;
            --header-shadow:rgba(251,114,153,.3);
            --accent:#fb7299;
            --accent-light:#ffeef2;
            --table-head-bg:#f9fafb;
            --card-header-from:#ffeef2;
            --card-header-to:#fff5f7;
            --modal-intro-bg:#f9fafb;
            --modal-stat-bg:#f9fafb;
            --toggle-bg:#f3f4f6;
        }
        [data-theme="dark"]{
            --bg:#0f172a;
            --text:#e2e8f0;
            --text-secondary:#94a3b8;
            --text-muted:#64748b;
            --card-bg:#1e293b;
            --card-hover:#334155;
            --border:#334155;
            --border-strong:#475569;
            --header-from:#be185d;
            --header-to:#db2777;
            --header-shadow:rgba(190,24,93,.4);
            --accent:#f472b6;
            --accent-light:#4a1942;
            --table-head-bg:#1e293b;
            --card-header-from:#4a1942;
            --card-header-to:#2d1b33;
            --modal-intro-bg:#334155;
            --modal-stat-bg:#334155;
            --toggle-bg:#334155;
        }
        *{box-sizing:border-box}
        body{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);min-height:100vh;line-height:1.7;color:var(--text);transition:background .3s,color .3s;margin:0}
        .header{background:linear-gradient(135deg,var(--header-from) 0%,var(--header-to) 100%);padding:20px 32px;color:#fff;box-shadow:0 4px 20px var(--header-shadow);position:sticky;top:0;z-index:100}
        .header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;min-width:0}
        .header h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;margin:0;flex:0 0 auto}
        .header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto;min-width:0;max-width:100%}
        .search-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1 1 260px;min-width:0;max-width:100%}
        .search-input{padding:10px 16px;border:none;border-radius:25px;font-size:14px;width:100%;min-width:120px;flex:1 1 200px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .search-btn{padding:10px 20px;background:#fff;border:none;border-radius:25px;color:var(--accent);font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .search-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
        .theme-toggle{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:20px;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(10px);flex-shrink:0}
        .theme-toggle:hover{background:rgba(255,255,255,.35);transform:scale(1.1);border-color:rgba(255,255,255,.6)}
        .nav-contribute{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:13px;font-weight:500;cursor:pointer;padding:0 14px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(10px);flex-shrink:0;text-decoration:none;white-space:nowrap}
        .nav-contribute:hover{background:rgba(255,255,255,.35);transform:scale(1.05);border-color:rgba(255,255,255,.6)}
        .main-container{max-width:1400px;margin:0 auto;padding:24px}
        .stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
        .stat-card{background:var(--card-bg);padding:20px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.04);text-align:center;transition:background .3s}
        .stat-card .stat-value{font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px}
        .stat-card .stat-label{font-size:13px;color:var(--text-secondary)}
        .toolbar{background:var(--card-bg);padding:16px 20px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.04);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;transition:background .3s}
        .view-toggle{display:flex;gap:4px;background:var(--toggle-bg);padding:4px;border-radius:10px}
        .view-btn{padding:6px 14px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .2s}
        .view-btn.active{background:var(--card-bg);color:var(--accent);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08)}
        .sort-select{padding:8px 14px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;cursor:pointer;background:var(--card-bg);color:var(--text);outline:none;transition:all .3s}
        .sort-select:focus{border-color:var(--accent)}
        .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
        .up-card{background:var(--card-bg);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.05);transition:all .3s;cursor:pointer}
        .up-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
        .up-card-header{background:linear-gradient(135deg,var(--card-header-from) 0%,var(--card-header-to) 100%);padding:24px 20px 40px;position:relative}
        .up-rank{position:absolute;top:12px;right:16px;background:rgba(251,114,153,.9);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
        .up-rank.top-3{background:linear-gradient(135deg,#ffd700,#ffb347)}
        .up-avatar{width:72px;height:72px;border-radius:50%;border:4px solid var(--card-bg);margin-top:20px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.1);background:var(--border)}
        .up-card-body{padding:16px 20px 20px}
        .up-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .up-intro{font-size:12px;color:var(--text-secondary);line-height:1.5;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:14px}
        .up-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--border)}
        .up-stat{flex:1;text-align:center}
        .up-stat-value{font-size:16px;font-weight:700;color:var(--accent)}
        .up-stat-label{font-size:11px;color:var(--text-muted);margin-top:2px}
        .table-view{background:var(--card-bg);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.04);transition:background .3s}
        .data-table{width:100%;border-collapse:collapse}
        .data-table th{background:var(--table-head-bg);padding:14px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-strong)}
        .data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text)}
        .data-table tr:hover{background:var(--card-hover)}
        .data-table .rank-cell{font-weight:700;color:var(--accent);width:60px}
        .data-table .name-cell{display:flex;align-items:center;gap:10px}
        .data-table .name-cell img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--border)}
        .pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:24px;flex-wrap:wrap}
        .page-btn{padding:8px 14px;border:1px solid var(--border-strong);background:var(--card-bg);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .2s}
        .page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
        .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .page-btn:disabled{opacity:.5;cursor:not-allowed}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:var(--card-bg);border-radius:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);transition:background .3s}
        .modal-header{background:linear-gradient(135deg,var(--header-from),var(--header-to));padding:24px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start}
        .modal-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;opacity:.8;line-height:1}
        .modal-close:hover{opacity:1}
        .modal-up-info{display:flex;align-items:center;gap:16px}
        .modal-up-info img{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.3);object-fit:cover;background:rgba(255,255,255,.2)}
        .modal-up-info h2{font-size:20px;margin-bottom:4px}
        .modal-up-info .uid{font-size:13px;opacity:.9}
        .modal-body{padding:24px}
        .modal-section{margin-bottom:20px}
        .modal-section h3{font-size:14px;color:var(--text-secondary);margin-bottom:8px;font-weight:600}
        .modal-section .intro-text{font-size:14px;color:var(--text);line-height:1.7;background:var(--modal-intro-bg);padding:12px 16px;border-radius:10px}
        .modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
        .modal-stat{background:var(--modal-stat-bg);padding:14px;border-radius:10px;text-align:center}
        .modal-stat .value{font-size:18px;font-weight:700;color:var(--accent)}
        .modal-stat .label{font-size:12px;color:var(--text-muted);margin-top:2px}
        .modal-actions{display:flex;gap:10px;margin-top:20px}
        .modal-actions a,.modal-actions button{flex:1;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
        .btn-bilibili{background:var(--accent);color:#fff}
        .btn-bilibili:hover{opacity:.9}
        .btn-refresh{background:var(--toggle-bg);color:var(--text)}
        .btn-refresh:hover{background:var(--border-strong)}
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .empty-state .icon{font-size:48px;margin-bottom:16px}
        @media (max-width:768px){
            .header{padding:14px 12px;overflow-x:hidden}
            .header-inner{gap:10px}
            .header h1{font-size:17px}
            .header-right{width:100%;gap:10px;justify-content:space-between}
            .search-bar{width:100%;gap:6px;flex:1 1 100%}
            .search-input{flex:1;min-width:0;padding:9px 14px;font-size:13px;border-radius:20px}
            .search-btn{padding:9px 16px;font-size:13px;white-space:nowrap;border-radius:20px}
            .nav-contribute{height:38px;padding:0 10px;font-size:12px;border-radius:19px;flex:1 1 auto;min-width:0}
            .theme-toggle{width:38px;height:38px;font-size:17px;flex-shrink:0}
            .main-container{padding:12px}
            .stats-bar{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
            .stat-card{padding:14px 12px;border-radius:12px}
            .stat-card .stat-value{font-size:20px}
            .stat-card .stat-label{font-size:12px;margin-top:2px}
            .toolbar{padding:10px 12px;border-radius:12px;gap:8px}
            .view-toggle{padding:4px;border-radius:10px}
            .view-btn{padding:6px 12px;font-size:12px;border-radius:8px}
            .sort-select{padding:8px 12px;font-size:12px;border-radius:8px}
            .card-grid{grid-template-columns:repeat(2,1fr);gap:10px}
            .up-card{border-radius:14px}
            .up-card-header{padding:14px 12px 26px}
            .up-avatar{width:48px;height:48px;margin-top:12px;border-width:3px}
            .up-rank{font-size:11px;padding:4px 10px;top:8px;right:10px}
            .up-card-body{padding:10px 12px 12px}
            .up-name{font-size:13px;margin-bottom:6px}
            .up-intro{font-size:11px;height:32px;-webkit-line-clamp:2;line-height:1.5;margin-bottom:10px}
            .up-stats{gap:8px;padding-top:10px}
            .up-stat-value{font-size:14px}
            .up-stat-label{font-size:10px;margin-top:2px}
            .table-view{overflow-x:auto;border-radius:12px}
            .data-table th{padding:10px 12px;font-size:12px}
            .data-table td{padding:10px 12px;font-size:13px}
            .data-table .name-cell img{width:28px;height:28px}
            .pagination{gap:4px;margin-top:16px}
            .page-btn{padding:8px 12px;font-size:12px;border-radius:8px}
            .modal{border-radius:14px;max-height:85vh}
            .modal-header{padding:18px 16px}
            .modal-up-info img{width:48px;height:48px}
            .modal-up-info h2{font-size:17px}
            .modal-up-info .uid{font-size:12px}
            .modal-body{padding:16px}
            .modal-stats{grid-template-columns:repeat(3,1fr);gap:10px}
            .modal-stat{padding:12px 8px;border-radius:8px}
            .modal-stat .value{font-size:16px}
            .modal-stat .label{font-size:11px;margin-top:2px}
            .modal-actions{gap:8px}
            .modal-actions a,.modal-actions button{padding:10px;border-radius:10px;font-size:13px}
        }
        @media (max-width:480px){
            .header-right{gap:6px}
            .nav-contribute{height:34px;padding:0 8px;font-size:11px;border-radius:17px}
            .theme-toggle{width:34px;height:34px;font-size:15px}
            .header h1{font-size:15px}
            .stats-bar{gap:8px}
            .stat-card{padding:12px 10px;border-radius:10px}
            .stat-card .stat-value{font-size:18px}
            .stat-card .stat-label{font-size:11px}
            .card-grid{gap:8px}
            .up-card-header{padding:12px 10px 22px}
            .up-avatar{width:42px;height:42px;margin-top:10px}
            .up-card-body{padding:8px 10px 10px}
            .up-name{font-size:12px}
            .up-intro{font-size:10px;height:28px}
            .up-stats{gap:6px}
            .up-stat-value{font-size:13px}
            .modal-stats{grid-template-columns:repeat(2,1fr)}
            .toolbar{flex-direction:column;align-items:stretch}
            .view-toggle{justify-content:center}
            .sort-select{width:100%}
        }
        .feedback-btn{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--header-from),var(--header-to));color:#fff;border:none;cursor:pointer;font-size:24px;box-shadow:0 4px 20px var(--header-shadow);transition:all .3s;z-index:999;display:flex;align-items:center;justify-content:center;text-decoration:none}
        .feedback-btn:hover{transform:scale(1.1);box-shadow:0 6px 28px var(--header-shadow)}
        @media (max-width:480px){
            .feedback-btn{width:48px;height:48px;font-size:20px;right:16px;bottom:16px}
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <h1><span>📺</span> 哔哩哔哩 UP 主数据</h1>
            <div class="header-right">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索 UP 主名称..." oninput="handleSearch()">
                    <button class="search-btn" onclick="handleSearch()">🔍 搜索</button>
                </div>
                <a href="chat.html" class="nav-contribute" title="群聊" target="_blank">💬 群聊</a>
                <a href="编辑.html" class="nav-contribute" title="编辑">✏️ 编辑</a>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</button>
            </div>
        </div>
    </div>
    <div class="main-container">
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-value" id="totalCount">--</div><div class="stat-label">UP 主总数</div></div>
            <div class="stat-card"><div class="stat-value" id="totalFans">--</div><div class="stat-label">总粉丝数</div></div>
            <div class="stat-card"><div class="stat-value" id="avgFans">--</div><div class="stat-label">平均粉丝</div></div>
            <div class="stat-card"><div class="stat-value" id="topFanCount">--</div><div class="stat-label">10万+ UP 主</div></div>
        </div>
        <div class="toolbar">
            <div class="view-toggle">
                <button class="view-btn active" onclick="switchView('card')" id="viewCard">🃏 卡片视图</button>
                <button class="view-btn" onclick="switchView('table')" id="viewTable">📋 表格视图</button>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <select class="sort-select" id="sortSelect" onchange="handleSort()">
                    <option value="fan_count">按粉丝数排序</option>
                    <option value="ranking">按排名排序</option>
                    <option value="name">按名称排序</option>
                    <option value="follow_count">按关注数排序</option>
                </select>
            </div>
        </div>
        <div id="contentArea">
            <div id="cardView" class="card-grid"></div>
            <div id="tableView" class="table-view" style="display:none;">
                <table class="data-table">
                    <thead><tr><th>排名</th><th>UP 主</th><th>粉丝数</th><th>关注数</th><th>简介</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div id="loadingState" class="empty-state" style="display:block;"><div class="icon">⏳</div><p>正在加载数据，请稍候...</p></div><div id="emptyState" class="empty-state" style="display:none;"><div class="icon">🔍</div><p>没有找到匹配的 UP 主</p></div>
    </div>
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-up-info">
                    <img loading="lazy" id="modalAvatar" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MCA1MCI+PGNpcmNsZSBjeD0iMjUiIGN5PSIyNSIgcj0iMjUiIGZpbGw9IiNlNWU3ZWIiLz48Y2lyY2xlIGN4PSIyNSIgY3k9IjIwIiByPSI4IiBmaWxsPSIjOWNhM2I4Ii8+PHBhdGggZD0iTTEwIDQ1YzAtOCA3LTE0IDE1LTE0czE1IDYgMTUgMTQiIGZpbGw9IiM5YWEzYjgiLz48L3N2Zz4=" alt="">
                    <div><h2 id="modalName">--</h2><div class="uid">UID: <span id="modalUid">--</span></div></div>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-section"><h3>个人简介</h3><div class="intro-text" id="modalIntro">--</div></div>
                <div class="modal-section"><h3>数据统计</h3>
                    <div class="modal-stats">
                        <div class="modal-stat"><div class="value" id="modalFans">--</div><div class="label">粉丝数</div></div>
                        <div class="modal-stat"><div class="value" id="modalFollowing">--</div><div class="label">关注数</div></div>
                        <div class="modal-stat"><div class="value" id="modalPlays">0</div><div class="label">播放数</div></div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-refresh" onclick="refreshFromBilibili()">🔄 从B站刷新</button>
                    <a href="#" target="_blank" class="btn-bilibili" id="modalLink">去 B站主页 →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="up-data.js"></script>
    <script>
        function initTheme(){
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }
        function toggleTheme(){
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            var newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }
        function updateThemeIcon(theme){
            var btn = document.getElementById('themeToggle');
            if(btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        initTheme();

        var allData = [];
        var filteredData = [];
        var currentPage = 1;
        var pageSize = 20;
        var currentSort = 'ranking';
        var currentView = 'card';
        var currentUp = null;
        var apiBase = 'https://api.bilibili.com/x/web-interface';
        var userCache = {};
        var loadingUids = {};
        var useApi = false;

        function formatNumber(n){
            if(n == null || isNaN(n)) return '-';
            n = Number(n);
            if(n>=10000)return(n/10000).toFixed(1)+'万';
            return n.toLocaleString();
        }

        var defaultAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MCA1MCI+PGNpcmNsZSBjeD0iMjUiIGN5PSIyNSIgcj0iMjUiIGZpbGw9IiNlNWU3ZWIiLz48Y2lyY2xlIGN4PSIyNSIgY3k9IjIwIiByPSI4IiBmaWxsPSIjOWNhM2I4Ii8+PHBhdGggZD0iTTEwIDQ1YzAtOCA3LTE0IDE1LTE0czE1IDYgMTUgMTQiIGZpbGw9IiM5YWEzYjgiLz48L3N2Zz4=';

        var jsonShardCache = {};
        var shardLoading = {};
        var shardCallbacks = {};

        function getShardId(uid){
            var n = parseInt(uid);
            if(!isNaN(n)){
                return (n % 6) + 1;
            }
            var h = 0;
            for(var i=0; i<uid.length; i++){
                h = ((h << 5) - h) + uid.charCodeAt(i);
                h |= 0;
            }
            return (Math.abs(h) % 6) + 1;
        }

        function loadShard(shardId, callback){
            var cacheKey = 'shard_' + shardId;
            if(jsonShardCache[cacheKey]){
                if(callback) callback(jsonShardCache[cacheKey]);
                return;
            }
            if(!shardCallbacks[shardId]) shardCallbacks[shardId] = [];
            shardCallbacks[shardId].push(callback);
            if(shardLoading[shardId]) return;
            shardLoading[shardId] = true;
            var s = document.createElement('script');
            s.src = 'avatars_' + shardId + '.js';
            s.onload = function(){
                var data = window['__AVATARS_' + shardId] || {};
                jsonShardCache[cacheKey] = data;
                shardLoading[shardId] = false;
                var cbs = shardCallbacks[shardId] || [];
                for(var i=0; i<cbs.length; i++){
                    if(cbs[i]) cbs[i](data);
                }
                shardCallbacks[shardId] = [];
            };
            s.onerror = function(){
                shardLoading[shardId] = false;
                jsonShardCache[cacheKey] = {};
                var cbs = shardCallbacks[shardId] || [];
                for(var j=0; j<cbs.length; j++){
                    if(cbs[j]) cbs[j]({});
                }
                shardCallbacks[shardId] = [];
            };
            document.head.appendChild(s);
        }

        function loadJsonAvatarImg(uid, callback){
            if(!uid){
                if(callback) callback('');
                return;
            }
            var shardId = getShardId(uid);
            loadShard(shardId, function(data){
                if(callback) callback(data[uid] || '');
            });
        }

        function getAvatarUrl(face, uid){
            if(face){
                return face;
            }
            return defaultAvatar;
        }

        function handleImgError(img){
            if(img.dataset.errorHandled) return;
            img.dataset.errorHandled = '1';
            img.src = defaultAvatar;
        }

        var lazyObserver = null;

        function initLazyLoad(){
            if(lazyObserver) return;
            if(!('IntersectionObserver' in window)){
                var imgs = document.querySelectorAll('img[data-src]');
                for(var i=0; i<imgs.length; i++){
                    loadLazyImg(imgs[i]);
                }
                return;
            }
            lazyObserver = new IntersectionObserver(function(entries){
                for(var i=0; i<entries.length; i++){
                    if(entries[i].isIntersecting){
                        loadLazyImg(entries[i].target);
                        lazyObserver.unobserve(entries[i].target);
                    }
                }
            }, {rootMargin: '200px 0px'});
            observeLazyImgs();
        }

        function observeLazyImgs(){
            if(!lazyObserver) return;
            var imgs = document.querySelectorAll('img[data-src]:not([data-observed])');
            for(var i=0; i<imgs.length; i++){
                imgs[i].setAttribute('data-observed', '1');
                lazyObserver.observe(imgs[i]);
            }
        }

        function loadLazyImg(img){
            var src = img.getAttribute('data-src');
            if(!src) return;
            img.src = src;
        }

        var avatarCache = {};
        var avatarLoading = {};

        function loadAvatarFromAPI(uid, callback){
            if(avatarCache[uid]){
                if(callback) callback(avatarCache[uid]);
                return;
            }
            if(avatarLoading[uid]){
                var check = setInterval(function(){
                    if(!avatarLoading[uid]){
                        clearInterval(check);
                        if(callback) callback(avatarCache[uid] || '');
                    }
                }, 100);
                return;
            }
            avatarLoading[uid] = true;

            function done(face){
                if(face){
                    avatarCache[uid] = face;
                }
                avatarLoading[uid] = false;
                if(callback) callback(face || '');
            }

            if(!useApi){
                done('');
                return;
            }

            fetch(apiBase + '/card?mid=' + uid, {referrerPolicy: 'no-referrer'})
                .then(function(r){return r.json();})
                .then(function(d){
                    if(d && d.code === 0 && d.data && d.data.card && d.data.card.face){
                        done(d.data.card.face);
                    } else {
                        done('');
                    }
                })
                .catch(function(){
                    done('');
                });
        }

        function loadAvatars(data, callback){
            var needLoad = [];
            data.forEach(function(it){
                if(it.u && !it.avatarLoaded && !avatarLoading[it.u]){
                    needLoad.push(it);
                    avatarLoading[it.u] = true;
                }
            });
            if(needLoad.length === 0){
                if(callback) callback();
                return;
            }

            if(!useApi){
                needLoad.forEach(function(it){
                    it.avatarLoaded = true;
                    avatarLoading[it.u] = false;
                });
                if(callback) callback();
                return;
            }

            var mids = needLoad.map(function(it){return it.u;}).join(',');

            fetch(apiBase + '/card?mid=' + mids, {referrerPolicy: 'no-referrer'})
                .then(function(r){return r.json();})
                .then(function(result){
                    if(result && result.code === 0 && result.data && result.data.card){
                        var card = result.data.card;
                        if(Array.isArray(card)){
                            card.forEach(function(c){
                                var it = needLoad.find(function(item){return item.u === c.mid;});
                                if(it && c.face){
                                    it.a = c.face;
                                    it.avatarLoaded = true;
                                    avatarCache[c.mid] = c.face;
                                    updateAvatarInDOM(c.mid, c.face);
                                }
                            });
                        } else {
                            var it = needLoad.find(function(item){return item.u === card.mid;});
                            if(it && card.face){
                                it.a = card.face;
                                it.avatarLoaded = true;
                                avatarCache[card.mid] = card.face;
                                updateAvatarInDOM(card.mid, card.face);
                            }
                        }
                    }
                    needLoad.forEach(function(it){
                        if(!it.avatarLoaded){
                            it.avatarLoaded = true;
                        }
                        avatarLoading[it.u] = false;
                    });
                    if(callback) callback();
                })
                .catch(function(){
                    needLoad.forEach(function(it){
                        it.avatarLoaded = true;
                        avatarLoading[it.u] = false;
                    });
                    if(callback) callback();
                });
        }

        function updateAvatarInDOM(uid, faceUrl){
            if(!uid || !faceUrl) return;
            var avatarUrl = getAvatarUrl(faceUrl, uid);
            var imgs = document.querySelectorAll('img[data-uid="' + uid + '"]');
            imgs.forEach(function(img){
                if(img.src !== avatarUrl){
                    img.src = avatarUrl;
                }
            });
        }

        function updateCardDisplay(uid){
            var item = allData.find(function(it){return it.u === uid});
            if(!item) return;

            var displayName = (item.n && item.n.trim()) ? item.n : ('UID:' + item.u);
            var introText = (item.i && item.i.trim()) ? item.i : '暂无简介';
            var fansText = item.f != null ? formatNumber(item.f) : '-';
            var followText = item.g != null ? formatNumber(item.g) : '-';

            var cards = document.querySelectorAll('.up-card[data-uid="' + uid + '"]');
            cards.forEach(function(card){
                var nameEl = card.querySelector('.up-name');
                if(nameEl) nameEl.textContent = displayName;
                var introEl = card.querySelector('.up-intro');
                if(introEl) introEl.textContent = introText;
                var statEls = card.querySelectorAll('.up-stat-value');
                if(statEls[0]) statEls[0].textContent = fansText;
                if(statEls[1]) statEls[1].textContent = followText;
            });

            var rows = document.querySelectorAll('tr[data-uid="' + uid + '"]');
            rows.forEach(function(row){
                var nameSpan = row.querySelector('.name-cell span');
                if(nameSpan) nameSpan.textContent = displayName;
                var cells = row.querySelectorAll('td');
                if(cells.length >= 5){
                    cells[2].textContent = fansText;
                    cells[3].textContent = followText;
                    cells[4].textContent = introText;
                }
            });
        }

        function initData(){
            allData = rawData.map(function(item){
                var hasName = !!(item.n && item.n.trim());
                var hasIntro = !!(item.i && item.i.trim());
                return {
                    r: item.r,
                    u: item.u,
                    n: item.n || '',
                    f: item.f != null ? item.f : null,
                    g: item.g != null ? item.g : null,
                    i: item.i || '',
                    a: item.a || item.face || '',
                    loaded: hasName && hasIntro,
                    avatarLoaded: !!(item.a || item.face)
                };
            });
            filteredData = allData.slice();
            updateStats();
            sortData();
            renderPage();
            setTimeout(initLazyLoad, 100);
        }

        function updateStats(){
            document.getElementById('totalCount').textContent = allData.length;
            var loadedCount = allData.filter(function(it){return it.loaded && it.f != null}).length;
            var tf = allData.reduce(function(s,it){return s + (it.f || 0)}, 0);
            document.getElementById('totalFans').textContent = loadedCount > 0 ? formatNumber(tf) : '-';
            document.getElementById('avgFans').textContent = loadedCount > 0 ? formatNumber(Math.round(tf/loadedCount)) : '-';
            document.getElementById('topFanCount').textContent = allData.filter(function(it){return it.f>=100000}).length;
        }

        function loadPageData(data, callback){
            var needLoad = [];
            data.forEach(function(it){
                var hasName = !!(it.n && it.n.trim());
                var hasIntro = !!(it.i && it.i.trim());
                if(it.u && (!hasName || !hasIntro) && !loadingUids[it.u]){
                    needLoad.push(it);
                    loadingUids[it.u] = true;
                }
            });

            if(needLoad.length === 0){
                if(callback) callback();
                return;
            }

            if(!useApi){
                needLoad.forEach(function(item){
                    var uid = item.u;
                    var hasName = !!(item.n && item.n.trim());
                    var hasIntro = !!(item.i && item.i.trim());
                    if(!hasName){
                        item.n = 'UID:' + uid;
                    }
                    if(!hasIntro){
                        item.i = '';
                    }
                    item.loaded = true;
                    delete loadingUids[uid];
                    updateCardDisplay(uid);
                });
                updateStats();
                if(callback) callback();
                return;
            }

            var loadedCount = 0;
            needLoad.forEach(function(item){
                var uid = item.u;
                fetch(apiBase + '/card?mid=' + uid, {referrerPolicy: 'no-referrer'})
                    .then(function(res){return res.json();})
                    .then(function(result){
                        if(result && result.code === 0 && result.data && result.data.card){
                            var card = result.data.card;
                            if(!item.n || !item.n.trim()){
                                item.n = card.name || item.n;
                            }
                            if(!item.i || !item.i.trim()){
                                item.i = card.sign || item.i;
                            }
                            if(card.fans != null){
                                item.f = card.fans;
                            }
                            if(card.attention != null){
                                item.g = card.attention;
                            }
                            if(card.face && !item.a){
                                item.a = card.face;
                                item.avatarLoaded = true;
                                updateAvatarInDOM(uid, card.face);
                            }
                            var hasName = !!(item.n && item.n.trim());
                            var hasIntro = !!(item.i && item.i.trim());
                            item.loaded = hasName && hasIntro;
                            userCache[uid] = card;
                        }
                        delete loadingUids[uid];
                        loadedCount++;
                        updateCardDisplay(uid);
                        if(loadedCount === needLoad.length){
                            updateStats();
                            if(callback) callback();
                        }
                    })
                    .catch(function(err){
                        console.error('加载用户数据失败:', uid, err);
                        var hasName = !!(item.n && item.n.trim());
                        var hasIntro = !!(item.i && item.i.trim());
                        if(!hasName){
                            item.n = 'UID:' + uid;
                        }
                        if(!hasIntro){
                            item.i = '';
                        }
                        item.loaded = true;
                        delete loadingUids[uid];
                        loadedCount++;
                        updateCardDisplay(uid);
                        if(loadedCount === needLoad.length){
                            updateStats();
                            if(callback) callback();
                        }
                    });
            });
        }

        function handleSearch(){
            var kw=document.getElementById('searchInput').value.toLowerCase().trim();
            currentPage=1;
            if(!kw){filteredData=allData.slice()}
            else{filteredData=allData.filter(function(it){return it.n.toLowerCase().indexOf(kw)>-1||(it.u&&String(it.u).indexOf(kw)>-1)})}
            sortData();renderPage();
        }

        function handleSort(){currentSort=document.getElementById('sortSelect').value;currentPage=1;sortData();renderPage()}

        function sortData(){
            filteredData.sort(function(a,b){
                switch(currentSort){
                    case'ranking':
                        if(a.r===0&&b.r===0){
                            var af=a.f==null?-1:a.f;
                            var bf=b.f==null?-1:b.f;
                            return bf-af;
                        }
                        if(a.r===0)return 1;
                        if(b.r===0)return -1;
                        return a.r-b.r;
                    case'fan_count':
                        var af=a.f==null?-1:a.f;
                        var bf=b.f==null?-1:b.f;
                        return bf-af;
                    case'follow_count':
                        var ag=a.g==null?-1:a.g;
                        var bg=b.g==null?-1:b.g;
                        return bg-ag;
                    case'name':return a.n.localeCompare(b.n,'zh-CN');
                    default:return 0;
                }
            });
        }

        function switchView(v){
            currentView=v;
            document.getElementById('viewCard').classList.toggle('active',v==='card');
            document.getElementById('viewTable').classList.toggle('active',v==='table');
            document.getElementById('cardView').style.display=v==='card'?'grid':'none';
            document.getElementById('tableView').style.display=v==='table'?'block':'none';
            renderPage();
        }

        function renderPage(){
            var s=(currentPage-1)*pageSize;
            var e=s+pageSize;
            var pd=filteredData.slice(s,e);
            if(filteredData.length===0){document.getElementById('contentArea').style.display='none';document.getElementById('emptyState').style.display='block';return}
            document.getElementById('emptyState').style.display='none';document.getElementById('contentArea').style.display='block';
            if(currentView==='card'){renderCards(pd)}else{renderTable(pd)}
            renderPagination();

            loadPageData(pd, function(){
                if(currentView==='card'){renderCards(pd)}else{renderTable(pd)}
            });
        }

        function renderCards(data){
            var c=document.getElementById('cardView');
            c.innerHTML=data.map(function(it){
                var rc=it.r>0&&it.r<=3?'top-3':'';
                var hasName = !!(it.n && it.n.trim() && !it.n.startsWith('UID:'));
                var hasUid = !!(it.n && it.n.startsWith('UID:'));
                var hasIntro = !!(it.i && it.i.trim());
                var displayName = hasName ? it.n : (hasUid ? it.n : '加载中...');
                var introText = hasIntro ? it.i : ((hasName || hasUid) ? '暂无简介' : '加载中...');
                var fansText = it.f != null ? formatNumber(it.f) : ((hasName || hasUid) ? '-' : '...');
                var followText = it.g != null ? formatNumber(it.g) : ((hasName || hasUid) ? '-' : '...');
                var avatarSrc = it.a || defaultAvatar;
                return '<div class="up-card" data-uid="'+esc(it.u||'')+'" onclick="openModalByUid(\''+esc(it.u||'')+'\')">' +
                    '<div class="up-card-header"><span class="up-rank '+rc+'">#'+(it.r?it.r:'-')+'</span>' +
                    '<img loading="lazy" class="up-avatar" data-src="'+esc(avatarSrc)+'" data-uid="'+esc(it.u||'')+'" src="'+esc(defaultAvatar)+'" alt="'+esc(displayName)+'" onerror="handleImgError(this)"></div>' +
                    '<div class="up-card-body"><div class="up-name">'+esc(displayName)+'</div>' +
                    '<div class="up-intro">'+esc(introText)+'</div>' +
                    '<div class="up-stats"><div class="up-stat"><div class="up-stat-value">'+fansText+'</div><div class="up-stat-label">粉丝</div></div>' +
                    '<div class="up-stat"><div class="up-stat-value">'+followText+'</div><div class="up-stat-label">关注</div></div></div></div></div>';
            }).join('');
            setTimeout(observeLazyImgs, 0);
        }

        function renderTable(data){
            var tb=document.getElementById('tableBody');
            tb.innerHTML=data.map(function(it){
                var hasName = !!(it.n && it.n.trim() && !it.n.startsWith('UID:'));
                var hasUid = !!(it.n && it.n.startsWith('UID:'));
                var hasIntro = !!(it.i && it.i.trim());
                var displayName = hasName ? it.n : (hasUid ? it.n : '加载中...');
                var introText = hasIntro ? it.i : ((hasName || hasUid) ? '-' : '加载中...');
                var fansText = it.f != null ? formatNumber(it.f) : ((hasName || hasUid) ? '-' : '...');
                var followText = it.g != null ? formatNumber(it.g) : ((hasName || hasUid) ? '-' : '...');
                var avatarSrc = it.a || defaultAvatar;
                return '<tr data-uid="'+esc(it.u||'')+'" onclick="openModalByUid(\''+esc(it.u||'')+'\')" style="cursor:pointer;">' +
                    '<td class="rank-cell">#'+(it.r?it.r:'-')+'</td>' +
                    '<td class="name-cell"><img loading="lazy" data-src="'+esc(avatarSrc)+'" data-uid="'+esc(it.u||'')+'" src="'+esc(defaultAvatar)+'" alt="" onerror="handleImgError(this)"><span>'+esc(displayName)+'</span></td>' +
                    '<td>'+fansText+'</td>' +
                    '<td>'+followText+'</td>' +
                    '<td style="color:#6b7280;font-size:13px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(introText)+'</td></tr>';
            }).join('');
            setTimeout(observeLazyImgs, 0);
        }

        function renderPagination(){
            var tp=Math.ceil(filteredData.length/pageSize);
            var c=document.getElementById('pagination');
            if(tp<=1){c.innerHTML='';return}
            var h='';
            h+='<button class="page-btn" onclick="goToPage(1)" '+(currentPage===1?'disabled':'')+'>首页</button>';
            h+='<button class="page-btn" onclick="goToPage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>上一页</button>';
            var ms=5;var sp=Math.max(1,currentPage-Math.floor(ms/2));var ep=Math.min(tp,sp+ms-1);
            if(ep-sp+1<ms)sp=Math.max(1,ep-ms+1);
            for(var i=sp;i<=ep;i++){h+='<button class="page-btn '+(i===currentPage?'active':'')+'" onclick="goToPage('+i+')">'+i+'</button>'}
            h+='<button class="page-btn" onclick="goToPage('+(currentPage+1)+')" '+(currentPage===tp?'disabled':'')+'>下一页</button>';
            h+='<button class="page-btn" onclick="goToPage('+tp+')" '+(currentPage===tp?'disabled':'')+'>末页</button>';
            c.innerHTML=h;
        }

        function goToPage(p){
            var tp=Math.ceil(filteredData.length/pageSize);
            if(p<1||p>tp)return;
            currentPage=p;renderPage();
            window.scrollTo({top:200,behavior:'smooth'});
        }

        function openModalByUid(uid){
            var up=allData.find(function(it){return String(it.u) === String(uid)});
            if(!up)return;
            currentUp=up;
            var hasRealName = !!(up.n && up.n.trim() && !up.n.startsWith('UID:'));
            var hasUidName = !!(up.n && up.n.startsWith('UID:'));
            var displayName = hasRealName ? up.n : (hasUidName ? up.n : ('UID:' + up.u));
            document.getElementById('modalName').textContent=displayName;
            document.getElementById('modalUid').textContent=up.u||'未知';
            document.getElementById('modalIntro').textContent=(up.i && up.i.trim()) ? up.i : ((hasRealName || hasUidName) ? '暂无简介' : '加载中...');
            document.getElementById('modalFans').textContent=up.f != null ? formatNumber(up.f) : ((hasRealName || hasUidName) ? '-' : '加载中...');
            document.getElementById('modalFollowing').textContent=up.g != null ? formatNumber(up.g) : ((hasRealName || hasUidName) ? '-' : '加载中...');
            var modalAvatar = document.getElementById('modalAvatar');
            var avatarUrl = up.a || defaultAvatar;
            modalAvatar.src = avatarUrl;
            modalAvatar.onerror = function(){handleImgError(this)};
            if(up.u){
                document.getElementById('modalLink').href='https://space.bilibili.com/'+up.u;
            }else{
                document.getElementById('modalLink').href='https://search.bilibili.com/all?keyword='+encodeURIComponent(up.n);
            }
            document.getElementById('modalOverlay').classList.add('active');

            var needLoad = !hasRealName && !hasUidName;
            if(needLoad && up.u){
                loadPageData([up], function(){
                    if(currentUp && currentUp.u === up.u){
                        var dName = (up.n && up.n.trim() && !up.n.startsWith('UID:')) ? up.n : ('UID:' + up.u);
                        document.getElementById('modalName').textContent=dName;
                        document.getElementById('modalIntro').textContent=(up.i && up.i.trim()) ? up.i : '暂无简介';
                        document.getElementById('modalFans').textContent=up.f != null ? formatNumber(up.f) : '-';
                        document.getElementById('modalFollowing').textContent=up.g != null ? formatNumber(up.g) : '-';
                    }
                });
            }
        }

        function openModal(name){
            var up=allData.find(function(it){return it.n===name});
            if(!up && name && name.startsWith('UID:')){
                var uid = name.replace('UID:', '');
                up = allData.find(function(it){return String(it.u) === uid});
            }
            if(!up)return;
            openModalByUid(up.u);
        }

        function closeModal(e){
            if(e&&e.target!==e.currentTarget)return;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function refreshFromBilibili(){
            if(!currentUp)return;
            if(!currentUp.u)return;
            document.getElementById('modalIntro').textContent='刷新中...';
            document.getElementById('modalFans').textContent='刷新中...';
            document.getElementById('modalFollowing').textContent='刷新中...';
            if(loadingUids[currentUp.u]){
                delete loadingUids[currentUp.u];
            }
            var needLoad = !!(currentUp.u);
            if(needLoad){
                loadPageData([currentUp], function(){
                    if(currentUp){
                        var dName = (currentUp.n && currentUp.n.trim()) ? currentUp.n : ('UID:' + currentUp.u);
                        document.getElementById('modalName').textContent=dName;
                        document.getElementById('modalIntro').textContent=(currentUp.i && currentUp.i.trim()) ? currentUp.i : '暂无简介';
                        document.getElementById('modalFans').textContent=currentUp.f != null ? formatNumber(currentUp.f) : '-';
                        document.getElementById('modalFollowing').textContent=currentUp.g != null ? formatNumber(currentUp.g) : '-';
                    }
                });
            }
        }

        function esc(t){var d=document.createElement('div');d.appendChild(document.createTextNode(t));return d.innerHTML}
        document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

        function loadData(callback){
            if(typeof rawData !== 'undefined' && Array.isArray(rawData)){
                console.log('rawData 已通过script标签加载，长度:', rawData.length);
                callback(rawData);
                return;
            }
            console.log('尝试通过fetch加载数据...');
            fetch('up-data.js?' + Date.now())
                .then(function(response){
                    if(!response.ok){
                        throw new Error('网络请求失败: ' + response.status);
                    }
                    return response.text();
                })
                .then(function(text){
                    var match = text.match(/^var rawData = (\[.*\]);?$/s);
                    if(match){
                        try{
                            var data = JSON.parse(match[1]);
                            rawData = data;
                            console.log('fetch加载成功，数据长度:', data.length);
                            callback(data);
                        }catch(e){
                            throw new Error('JSON解析失败: ' + e.message);
                        }
                    }else{
                        throw new Error('数据格式不匹配');
                    }
                })
                .catch(function(error){
                    console.error('数据加载失败:', error.message);
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('contentArea').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    document.getElementById('emptyState').innerHTML = '<div class="icon">⚠️</div><p>数据加载失败，请检查网络连接并刷新页面重试</p>';
                });
        }

        loadData(function(data){
            document.getElementById('loadingState').style.display = 'none';
            initData();
        });
    </script>
