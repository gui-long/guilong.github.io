<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki 页面编辑</title>
    <!-- CKEditor 5 富文本编辑器 -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.0/classic/ckeditor.js"></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 排版 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px 45px 50px;
            transition: all 0.2s;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            line-height: 1.6;
        }

        .subtitle strong {
            color: #0f172a;
        }

        /* ===== 编辑器容器 ===== */
        .editor-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }

        .editor-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        #editor {
            height: 420px;
        }

        /* ===== 底部工具栏 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 8px;
        }

        .info-hint {
            font-size: 14px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-hint span {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #475569;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #1e293b;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.20);
        }

        .btn-primary:active {
            transform: translateY(0px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-outline {
            background: transparent;
            color: #64748b;
            border: 1.5px solid #e2e8f0;
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        /* ===== 状态消息 ===== */
        #status {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeSlide 0.35s ease;
        }

        #status.success {
            display: flex;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        #status.error {
            display: flex;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        #status.loading {
            display: flex;
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px 32px;
            }

            h1 {
                font-size: 22px;
            }

            #editor {
                height: 280px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .actions {
                justify-content: stretch;
            }

            .btn {
                flex: 1;
                padding: 12px 16px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 标题 -->
        <h1>
            <span></span> 编辑此页面
        </h1>
        <div class="subtitle">
            修改内容后点击 <strong>「提交修改」</strong>，编辑后的内容将发送给站长。
        </div>

        <!-- 编辑器 -->
        <div class="editor-wrapper">
            <div id="editor">
                <p style="color:#94a3b8;">当前页面</p>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="info-hint">
                 编辑后点击提交
                <span>CKEditor 5</span>
            </div>
            <div class="actions">
                <button class="btn btn-outline" onclick="resetEditor()" type="button">
                     重置
                </button>
                <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">
                     提交修改
                </button>
            </div>
        </div>

        <!-- 状态消息 -->
        <div id="status"></div>

    </div>

    <script>
        // ======================================================
        //  1. 你的 EmailJS 密钥（已自动填入）
        // ======================================================
        const EMAILJS_PUBLIC_KEY = 'QkW_fzzyqbT4ipCU5';
        const EMAILJS_SERVICE_ID = 'service_twmqflf';
        const EMAILJS_TEMPLATE_ID = 'template_2yk1tmf';

        // ======================================================
        //  2. 初始化 EmailJS
        // ======================================================
        emailjs.init(EMAILJS_PUBLIC_KEY);

        // ======================================================
        //  3. 初始化 CKEditor 5
        // ======================================================
        let editorInstance = null;

        ClassicEditor
            .create(document.querySelector('#editor'), {
                // 简单工具栏，够用就好
                toolbar: [
                    'heading', '|',
                    'bold', 'italic', 'underline', 'strikethrough', '|',
                    'link', '|',
                    'bulletedList', 'numberedList', '|',
                    'undo', 'redo'
                ],
                heading: {
                    options: [
                        { model: 'paragraph', title: '段落', class: 'ck-heading_paragraph' },
                        { model: 'heading1', view: 'h1', title: '标题 1' },
                        { model: 'heading2', view: 'h2', title: '标题 2' },
                        { model: 'heading3', view: 'h3', title: '标题 3' }
                    ]
                }
            })
            .then(editor => {
                editorInstance = editor;
                console.log('✅ CKEditor 已加载');
                loadSourcePageContent();
            })
            .catch(error => {
                console.error('❌ CKEditor 加载失败:', error);
                document.getElementById('status').className = 'error';
                document.getElementById('status').textContent = '⚠️ 编辑器加载失败，请刷新页面重试。';
                document.getElementById('status').style.display = 'flex';
            });

        // ======================================================
        //  3.5 自动填充：从来源页抓取内容载入编辑器
        // ======================================================
        function getSourcePageUrl() {
            // 优先用 URL 里的 ?page= 参数（最可靠）
            var params = new URLSearchParams(window.location.search);
            var page = params.get('page');
            if (page) return page;
            // 退回 document.referrer（同源才用）
            var ref = document.referrer;
            if (ref) {
                try {
                    if (new URL(ref, window.location.href).origin === window.location.origin) return ref;
                } catch (e) {}
            }
            return '';
        }

        function loadSourcePageContent() {
            var sub = document.querySelector('.subtitle');
            // —— 优先从 sessionStorage 读取（file:// 下可靠，由来源页点击 ✉️ 时写入）——
            var cachedContent = '';
            var cachedUrl = '';
            var cachedTitle = '';
            try {
                cachedContent = sessionStorage.getItem('editPageContent') || '';
                cachedUrl = sessionStorage.getItem('editPageUrl') || '';
                cachedTitle = sessionStorage.getItem('editPageTitle') || '';
            } catch (e) {}
            if (cachedContent) {
                // 读取后立即清除，避免刷新或下次进入时误用旧缓存
                try { sessionStorage.removeItem('editPageContent'); sessionStorage.removeItem('editPageUrl'); sessionStorage.removeItem('editPageTitle'); } catch (e) {}
                var fileName = cachedUrl.split('/').pop().split('?')[0] || '来源页';
                var pageTitle = cachedTitle || fileName;
                if (editorInstance) editorInstance.setData(cachedContent);
                if (sub) sub.innerHTML = '📄 当前页面：<strong>' + pageTitle + '</strong>（来源：' + fileName + '）。修改后点击「提交修改」即可。';
                document.title = '编辑：' + pageTitle;
                return;
            }
            // —— 退回 fetch 方案（仅 http 预览下可用）——
            var srcUrl = getSourcePageUrl();
            if (!srcUrl) {
                if (sub) {
                    sub.innerHTML = '⚠️ 未检测到来源页面。请在站点内点击页面右下角的 ✉️ 按钮进入，或直接在下方编辑后提交。';
                }
                if (editorInstance) editorInstance.setData('<p style="color:#94a3b8;">当前页面（未检测到来源页）</p>');
                return;
            }
            var fileName2 = srcUrl.split('/').pop().split('?')[0];
            if (sub) sub.innerHTML = '🔍 检测到来源页：<strong>' + fileName2 + '</strong>，正在加载内容...';
            if (editorInstance) editorInstance.setData('<p style="color:#94a3b8;">正在加载 ' + fileName2 + ' 的内容...</p>');
            fetch(srcUrl, { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var src = doc.querySelector('.page-content') || doc.querySelector('.main-content');
                    var titleEl = doc.querySelector('h1.page-title') || doc.querySelector('h1');
                    var content = src ? src.innerHTML : '';
                    var pageTitle = titleEl ? titleEl.textContent.trim() : fileName2;
                    if (!content) {
                        if (sub) sub.innerHTML = '⚠️ 已加载 <strong>' + fileName2 + '</strong>，但未识别到正文内容（.page-content），可能是特殊页面，可直接编辑后提交。';
                        if (editorInstance) editorInstance.setData('<p style="color:#94a3b8;">当前页面：' + pageTitle + '（未识别到正文）</p>');
                        return;
                    }
                    if (editorInstance) editorInstance.setData(content);
                    if (sub) sub.innerHTML = '📄 当前页面：<strong>' + pageTitle + '</strong>（来源：' + fileName2 + '）。修改后点击「提交修改」即可。';
                    document.title = '编辑：' + pageTitle;
                })
                .catch(function (err) {
                    console.warn('自动填充失败:', err);
                    if (sub) sub.innerHTML = '⚠️ 检测到来源页 <strong>' + fileName2 + '</strong>，但加载失败（' + err.message + '）。本地直接打开(file://)时无法自动抓取，请通过站点内 ✉️ 按钮进入；或直接在下方编辑后提交。';
                    if (editorInstance) editorInstance.setData('<p style="color:#94a3b8;">当前页面（加载失败：' + err.message + '）</p>');
                });
        }

        // ======================================================
        //  4. 核心提交逻辑
        // ======================================================
        function handleSubmit() {
            const status = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            // 检查编辑器是否就绪
            if (!editorInstance) {
                showStatus('error', '⏳ 编辑器尚未加载完成，请稍后再试。');
                return;
            }

            // 获取编辑器内容（HTML 格式）
            const content = editorInstance.getData();

            // 简单校验：如果内容为空或只有空白，提醒用户
            const plainText = editorInstance.getData({ trim: 'empty' });
            if (!plainText || plainText.trim() === '') {
                showStatus('error', '✏️ 内容不能为空，请填写一些内容再提交。');
                return;
            }

            // 禁用按钮，防止重复点击
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 发送中...';
            showStatus('loading', '⏳ 正在发送邮件，请稍候...');

            // 构造要发送的数据（变量名必须和 EmailJS 模板里的一致）
            const templateParams = {
                page_url: window.location.href, // 当前页面地址
                editor_content: content, // 编辑器里的 HTML 内容
                submission_time: new Date().toLocaleString('zh-CN', {
                    timeZone: 'Asia/Shanghai'
                }) // 提交时间
            };

            // 调用 EmailJS 发送邮件
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(function(response) {
                    console.log('✅ 邮件发送成功:', response);
                    showStatus('success', '✅ 提交成功！内容已发送给站长。感谢你的贡献！');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 提交修改';
                })
                .catch(function(error) {
                    console.error('❌ 邮件发送失败:', error);
                    showStatus('error', '❌ 提交失败，请重试。错误信息：' + (error.text || error.message || '未知错误'));
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 提交修改';
                });
        }

        // ======================================================
        //  5. 重置编辑器
        // ======================================================
        function resetEditor() {
            if (!editorInstance) return;
            // 重新加载来源页内容；无来源则清空
            var srcUrl = getSourcePageUrl();
            if (srcUrl) {
                editorInstance.setData('<p style="color:#94a3b8;">正在重新加载...</p>');
                loadSourcePageContent();
                showStatus('success', '🔄 已重新加载页面内容。');
            } else {
                editorInstance.setData('');
                showStatus('success', '🔄 已清空编辑器。');
            }
            setTimeout(() => {
                const status = document.getElementById('status');
                status.style.display = 'none';
            }, 2500);
        }

        // ======================================================
        //  6. 辅助：显示状态消息
        // ======================================================
        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = type;
            status.textContent = message;
            status.style.display = 'flex';
        }
    </script>

</body>
</html>
