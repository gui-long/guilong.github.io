<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FurryWiki 画廊 - 精选Furry绘画作品展示，收录兽圈优秀画师作品">
    <meta name="keywords" content="Furry画廊,兽人绘画,兽圈画师,Furry艺术,FurryWiki">
    <meta name="author" content="FurryWiki">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="绘画作品 · FurryWiki 画廊">
    <meta property="og:description" content="FurryWiki 画廊 - 精选Furry绘画作品展示，收录兽圈优秀画师作品">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <title>绘画作品 · FurryWiki 画廊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root{
            --bg:#f5f6f8;
            --text:#2c3e50;
            --text-secondary:#4b5563;
            --card-bg:#fff;
            --border:#eef1f5;
            --accent:#57c3ff;
            --tag-bg:#f0f6ff;
            --tag-text:#3b82f6;
        }
        [data-theme="dark"]{
            --bg:#0f172a;
            --text:#e2e8f0;
            --text-secondary:#94a3b8;
            --card-bg:#1e293b;
            --border:#334155;
            --accent:#38bdf8;
            --tag-bg:#1e3a5f;
            --tag-text:#7dd3fc;
        }
        [data-colorblind="true"]{
            --accent:#f59e0b;
            --accent-light:#fffbeb;
            --highlight-box:#fffbeb;
            --section-bg:#fffbeb;
            --section-border:#fef3c7;
        }
        [data-theme="dark"][data-colorblind="true"]{
            --accent:#fbbf24;
            --accent-light:#451a03;
            --highlight-box:#451a03;
            --section-bg:#451a03;
            --section-border:#78350f;
        }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            line-height: 1.7;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px 60px;
            transition: background .3s, color .3s;
        }
        .gallery-container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 36px 40px;
            text-align: center;
            position: relative;
            transition: background .3s;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 80px);
        }
        .theme-toggle-top{
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--tag-bg);
            border: none;
            color: var(--tag-text);
            font-size: 14px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all .2s;
            font-weight: 500;
        }
        .theme-toggle-top:hover{
            transform: scale(1.05);
        }
        .gallery-heading {
            color: var(--text);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 16px;
            margin-bottom: 32px;
            font-size: 34px;
            font-weight: 700;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin: 32px 0;
        }
        .gallery-item {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.25s, box-shadow 0.25s;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 28px rgba(0,0,0,0.1);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: var(--border);
        }
        .gallery-item .caption {
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }
        .gallery-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .gallery-footer a {
            text-decoration: none;
            vertical-align: middle;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .gallery-footer a:hover span {
            color: var(--accent) !important;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        @media (max-width: 640px) {
            .gallery-container { padding: 24px 20px; border-radius: 20px; }
            .gallery-heading { font-size: 26px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        }
        .feedback-btn{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#4da1ff);color:#fff;border:none;cursor:pointer;font-size:24px;box-shadow:0 4px 20px rgba(87,195,255,.4);transition:all .3s;z-index:999;display:flex;align-items:center;justify-content:center}
        .feedback-btn:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(87,195,255,.5)}
        .feedback-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .feedback-modal.show{display:flex}
        .feedback-box{background:var(--card-bg);border-radius:20px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;transition:background .3s}
        .feedback-header{background:linear-gradient(135deg,var(--accent),#4da1ff);padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between}
        .feedback-header h3{font-size:18px;font-weight:700}
        .feedback-close{background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;opacity:.8;transition:opacity .2s}
        .feedback-close:hover{opacity:1}
        .feedback-body{padding:24px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--card-bg);color:var(--text);outline:none;transition:border-color .2s;font-family:inherit}
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
        .form-group textarea{resize:vertical;min-height:120px;line-height:1.6}
        .feedback-submit{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4da1ff);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
        .feedback-submit:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(87,195,255,.4)}
        .feedback-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
        .feedback-success{text-align:center;padding:20px 0;display:none}
        .feedback-success.show{display:block}
        .feedback-success .icon{font-size:48px;margin-bottom:12px}
        .feedback-success h4{font-size:18px;color:var(--text);margin-bottom:8px}
        .feedback-success p{font-size:14px;color:var(--text-secondary)}
        @media (max-width: 640px) {
            .feedback-btn{width:48px;height:48px;font-size:20px;right:16px;bottom:16px}
            .feedback-body{padding:16px}
        }
    </style>
<script src="common.js"></script>
</head>
<body>
    <div class="gallery-container">
        <button class="theme-toggle-top" id="themeToggle" onclick="toggleTheme()">🌙 深色模式</button>
        <h1 class="gallery-heading">🖼️ 绘画作品</h1>

        <div class="gallery-footer">
            本站图像服务由
            <a href="https://www.beeimg.cn/" target="_blank" rel="noopener noreferrer" title="蜜蜂图床"
               onmouseover="this.querySelector('span').style.color='#0ea5e9'"
               onmouseout="this.querySelector('span').style.color='#38bdf8'">
                <img src="https://www.beeimg.cn/favicon.png" alt="蜜蜂图床"
                     style="height: 20px; vertical-align: middle; border: none;" loading="lazy">
                <span style="color: #38bdf8; font-weight: 700; transition: color 0.2s;">蜜蜂图床</span>
            </a>
            提供
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">← 返回主站</a>
        </div>

        <div style="flex-grow:1;"></div>
    </div>

    <script>
        
    </script>

    <button class="feedback-btn" onclick="openFeedback()" title="投稿/反馈">✉️</button>

    <div class="feedback-modal" id="feedbackModal" onclick="closeFeedback(event)">
        <div class="feedback-box" onclick="event.stopPropagation()">
            <div class="feedback-header">
                <h3>📝 投稿 / 反馈</h3>
                <button class="feedback-close" onclick="closeFeedback()">×</button>
            </div>
            <div class="feedback-body" id="feedbackFormArea">
                <form id="feedbackForm" onsubmit="submitFeedback(event)">
                    <input type="text" name="_gotcha" style="display:none">
                    <input type="hidden" name="page" value="绘画作品画廊">
                    <div class="form-group">
                        <label>你的昵称</label>
                        <input type="text" name="name" placeholder="选填" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label>联系邮箱</label>
                        <input type="email" name="email" placeholder="选填，方便回复你" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>类型</label>
                        <select name="type">
                            <option value="art-submit">作品投稿</option>
                            <option value="content-error">内容错误</option>
                            <option value="suggestion">功能建议</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>内容 <span style="color:var(--accent);">*</span></label>
                        <textarea name="message" placeholder="请描述你想提交的内容，投稿请附上作品链接..." required maxlength="2000"></textarea>
                    </div>
                    <button type="submit" class="feedback-submit" id="feedbackSubmitBtn">提交</button>
                </form>
            </div>
            <div class="feedback-body">
                <div class="feedback-success" id="feedbackSuccess">
                    <div class="icon">✅</div>
                    <h4>提交成功！</h4>
                    <p>感谢你的投稿/反馈，我们会尽快处理~</p>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        var emailjsLoaded = false;

        function loadEmailJs(callback){
            if(emailjsLoaded){
                callback();
                return;
            }
            var script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js";
            script.onload = function(){
                emailjs.init(CONFIG.getEmailJsPublicKey());
                emailjsLoaded = true;
                callback();
            };
            script.onerror = function(){
                alert("反馈服务加载失败，请稍后再试");
            };
            document.head.appendChild(script);
        }

        function openFeedback(){
            document.getElementById('feedbackModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function closeFeedback(e){
            if(e && e.target !== e.currentTarget) return;
            document.getElementById('feedbackModal').classList.remove('show');
            document.body.style.overflow = '';
            document.getElementById('feedbackForm').reset();
            document.getElementById('feedbackSuccess').classList.remove('show');
            document.getElementById('feedbackFormArea').style.display = 'block';
            document.getElementById('feedbackSubmitBtn').disabled = false;
            document.getElementById('feedbackSubmitBtn').textContent = '提交';
        }
        function submitFeedback(e){
            e.preventDefault();
            var btn = document.getElementById('feedbackSubmitBtn');
            btn.disabled = true;
            btn.textContent = '加载中...';
            loadEmailJs(function(){
                btn.textContent = '提交中...';

                var form = document.getElementById('feedbackForm');
                var formData = new FormData(form);
                var params = {
                    user_name: formData.get('name') || '匿名用户',
                    user_email: formData.get('email') || '无',
                    type: formData.get('type'),
                    page: formData.get('page'),
                    message: formData.get('message'),
                    submit_time: new Date().toLocaleString('zh-CN')
                };

                emailjs.send(CONFIG.getEmailJsServiceId(), CONFIG.getEmailJsTemplateId(), params)
                    .then(function(){
                        document.getElementById('feedbackFormArea').style.display = 'none';
                        document.getElementById('feedbackSuccess').classList.add('show');
                    })
                    .catch(function(err){
                        alert('提交失败，请稍后再试');
                        btn.disabled = false;
                        btn.textContent = '提交';
                    });
            });
        }
        document.addEventListener('keydown',function(e){
            if(e.key === 'Escape'){
                var modal = document.getElementById('feedbackModal');
                if(modal.classList.contains('show')) closeFeedback();
            }
        });
    </script>
</body>
</html>
