    <title>绘画作品 · FurryWiki 画廊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root{
            --bg:#f5f6f8;
            --text:#2c3e50;
            --text-secondary:#4b5563;
            --card-bg:#fff;
            --border:#eef1f5;
            --accent:#57c3ff;
            --tag-bg:#f0f6ff;
            --tag-text:#3b82f6;
        }
        [data-theme="dark"]{
            --bg:#0f172a;
            --text:#e2e8f0;
            --text-secondary:#94a3b8;
            --card-bg:#1e293b;
            --border:#334155;
            --accent:#38bdf8;
            --tag-bg:#1e3a5f;
            --tag-text:#7dd3fc;
        }
        [data-colorblind="true"]{
            --accent:#f59e0b;
            --accent-light:#fffbeb;
            --highlight-box:#fffbeb;
            --section-bg:#fffbeb;
            --section-border:#fef3c7;
        }
        [data-theme="dark"][data-colorblind="true"]{
            --accent:#fbbf24;
            --accent-light:#451a03;
            --highlight-box:#451a03;
            --section-bg:#451a03;
            --section-border:#78350f;
        }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            line-height: 1.7;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px 60px;
            transition: background .3s, color .3s;
        }
        .gallery-container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 36px 40px;
            text-align: center;
            position: relative;
            transition: background .3s;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 80px);
        }
        .theme-toggle-top{
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--tag-bg);
            border: none;
            color: var(--tag-text);
            font-size: 14px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all .2s;
            font-weight: 500;
        }
        .theme-toggle-top:hover{
            transform: scale(1.05);
        }
        .gallery-heading {
            color: var(--text);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 16px;
            margin-bottom: 32px;
            font-size: 34px;
            font-weight: 700;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin: 32px 0;
        }
        .gallery-item {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.25s, box-shadow 0.25s;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 28px rgba(0,0,0,0.1);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: var(--border);
        }
        .gallery-item .caption {
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }
        .gallery-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .gallery-footer a {
            text-decoration: none;
            vertical-align: middle;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .gallery-footer a:hover span {
            color: var(--accent) !important;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        @media (max-width: 640px) {
            .gallery-container { padding: 24px 20px; border-radius: 20px; }
            .gallery-heading { font-size: 26px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        }
        .feedback-btn{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#4da1ff);color:#fff;border:none;cursor:pointer;font-size:24px;box-shadow:0 4px 20px rgba(87,195,255,.4);transition:all .3s;z-index:999;display:flex;align-items:center;justify-content:center;text-decoration:none}
        .feedback-btn:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(87,195,255,.5)}
        @media (max-width: 640px) {
            .feedback-btn{width:48px;height:48px;font-size:20px;right:16px;bottom:16px}
        }
    </style>

        <h1 class="gallery-heading">🖼️ 绘画作品</h1>

        <div class="gallery-footer">
            本站图像服务由

            提供
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">← 返回主站</a>

        </div>

        <div style="flex-grow:1;"></div>
    </div>
