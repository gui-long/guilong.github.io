    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root{
            --bg:#f5f6f8;
            --text:#2c3e50;
            --text-secondary:#4b5563;
            --text-muted:#6b7280;
            --card-bg:#fff;
            --card-hover:#f8fafc;
            --border:#eef1f5;
            --border-strong:#e4e7eb;
            --nav-bg:#1a1c23;
            --nav-text:#b0b5c0;
            --accent:#57c3ff;
            --accent-light:#f0f6ff;
            --highlight-box:#f0f6ff;
            --ranking-bg:#1a1c23;
            --ranking-text:#eee;
            --ranking-bar-bg:#2a2d35;
            --ranking-note:#777e8c;
            --btn-bg:#eef1f5;
            --btn-text:#333;
            --icon-note-bg:#444b5a;
            --section-bg:#fdf2f8;
            --section-border:#fce7f3;
        }
        [data-theme="dark"]{
            --bg:#0f172a;
            --text:#e2e8f0;
            --text-secondary:#cbd5e1;
            --text-muted:#94a3b8;
            --card-bg:#1e293b;
            --card-hover:#334155;
            --border:#334155;
            --border-strong:#475569;
            --nav-bg:#0f172a;
            --nav-text:#94a3b8;
            --accent:#38bdf8;
            --accent-light:#1e3a5f;
            --highlight-box:#1e3a5f;
            --ranking-bg:#1e293b;
            --ranking-text:#e2e8f0;
            --ranking-bar-bg:#334155;
            --ranking-note:#64748b;
            --btn-bg:#334155;
            --btn-text:#e2e8f0;
            --icon-note-bg:#475569;
            --section-bg:#3f1d38;
            --section-border:#5b2a50;
        }
        [data-colorblind="true"]{
            --accent:#f59e0b;
            --accent-light:#fffbeb;
            --highlight-box:#fffbeb;
            --section-bg:#fffbeb;
            --section-border:#fef3c7;
        }
        [data-theme="dark"][data-colorblind="true"]{
            --accent:#fbbf24;
            --accent-light:#451a03;
            --highlight-box:#451a03;
            --section-bg:#451a03;
            --section-border:#78350f;
        }
        body { font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; background: var(--bg); display: flex; min-height: 100vh; line-height: 1.7; color: var(--text); transition: background .3s, color .3s; margin: 0; padding: 0; }
        nav { position: fixed; top: 0; left: 0; width: 300px; height: 100vh; background: var(--nav-bg); display: flex; flex-direction: column; padding: 30px 0 24px 0; box-shadow: 4px 0 25px rgba(0,0,0,0.25); z-index: 9999; overflow-y: auto; overflow-x: hidden; flex-shrink: 0; scrollbar-width: thin; scrollbar-color: #4a4a5a transparent; border-right: 1px solid rgba(255,255,255,0.08); transition: background .3s; }
        nav::-webkit-scrollbar { width: 6px; }
        nav::-webkit-scrollbar-track { background: transparent; }
        nav::-webkit-scrollbar-thumb { background: #4a4a5a; border-radius: 10px; }
        .logo { color: #fff; font-size: 30px; font-weight: 700; text-decoration: none; padding: 10px 30px 28px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; display: block; letter-spacing: 1.5px; }
        .logo:hover { color: #57c3ff; }
        nav .nav-link { color: var(--nav-text); text-decoration: none; font-size: 16px; padding: 14px 30px; margin: 3px 12px; border-radius: 10px; transition: all 0.2s; flex-shrink: 0; display: block; border-left: 4px solid transparent; white-space: nowrap; font-weight: 500; }
        nav .nav-link:hover { color: #fff; background: rgba(255,255,255,0.06); border-left: 4px solid var(--accent); }
        nav .nav-link.active { color: #fff; background: rgba(87,195,255,0.15); border-left: 4px solid var(--accent); }
        .lang-group { margin-top: auto; flex-shrink: 0; padding: 24px 18px 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; flex-direction: column; align-items: center; }
        .lang-row { display: flex; gap: 10px; }
        .theme-toggle-row { margin-top: 14px; }
        .theme-toggle-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #ccc; padding: 10px 20px; border-radius: 24px; cursor: pointer; font-size: 14px; transition: 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
        .theme-toggle-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .lang-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); color: #ccc; padding: 8px 18px; border-radius: 24px; cursor: pointer; font-size: 14px; transition: 0.3s; white-space: nowrap; }
        .lang-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .lang-btn.active { background: #57c3ff; color: #fff; border-color: #57c3ff; font-weight: 600; }
        .main-content { margin-left: 300px; flex: 1; min-width: 0; padding: 60px 50px 40px 50px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        html { scroll-behavior: smooth; }
        .welcome-box { text-align: center; max-width: 700px; }
        .welcome-box h1 { font-size: 48px; font-weight: 700; margin-bottom: 24px; background: linear-gradient(135deg, var(--accent), #4da1ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .welcome-box p { font-size: 18px; color: var(--text-secondary); line-height: 2; margin-bottom: 40px; }
        .welcome-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; margin-top: 40px; }
        .welcome-card { background: var(--card-bg); padding: 28px 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); transition: all 0.3s; text-decoration: none; color: var(--text); border: 1px solid var(--border); }
        .welcome-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); border-color: var(--accent); }
        .welcome-card .icon { font-size: 36px; margin-bottom: 12px; }
        .welcome-card .title { font-size: 16px; font-weight: 600; }

        @media (max-width: 768px) {
            
            body { flex-direction: column; }
            nav { position: fixed; top: 0; width: 100%; height: 56px; flex-direction: row; align-items: center; padding: 0 16px; overflow-x: auto; white-space: nowrap; z-index: 1000; -webkit-overflow-scrolling: touch; }
            .logo { font-size: 18px; padding: 0 16px 0 6px; border-bottom: none; margin: 0; font-weight: 700; }
            nav .nav-link { font-size: 14px; padding: 8px 16px; margin: 0; border-radius: 20px; }
            .lang-group { margin: 0; padding: 0 12px 0 8px; border: none; flex-direction: row; gap: 8px; align-items: center; }
            .lang-row { display: flex; gap: 6px; }
            
            
            .lang-btn { font-size: 12px; padding: 5px 12px; border-radius: 16px; }
            .theme-toggle-row { margin-top: 0; display: flex; gap: 6px; }
            #themeToggle { font-size: 0; padding: 5px 10px; border-radius: 16px; gap: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
            #themeToggle::before { content: "🌙"; font-size: 14px; }
            [data-theme="dark"] #themeToggle::before { content: "☀️"; }
            #colorblindToggle { font-size: 0; padding: 5px 10px; border-radius: 16px; gap: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
            #colorblindToggle::before { content: "👁️"; font-size: 14px; }
            [data-colorblind="true"] #colorblindToggle::before { content: "🔴"; font-size: 14px; }
            
            
            .main-content { margin-left: 0; padding: 80px 20px 40px 20px; }
            .welcome-box h1 { font-size: 32px; }
            .welcome-box p { font-size: 15px; }
            .welcome-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .welcome-card { padding: 20px 14px; }
            .welcome-card .icon { font-size: 28px; }
            .welcome-card .title { font-size: 14px; }
        }
        @media (max-width: 480px) {
            nav { height: 50px; padding: 0 10px; }
            .logo { font-size: 16px; padding: 0 12px 0 4px; }
            nav .nav-link { font-size: 12px; padding: 6px 12px; }
            .lang-group { padding: 0 8px 0 6px; gap: 6px; }
            .lang-btn { font-size: 11px; padding: 4px 10px; }
            #themeToggle { padding: 4px 8px; width: 28px; height: 28px; }
            #themeToggle::before { font-size: 13px; }
            #colorblindToggle { padding: 4px 8px; width: 28px; height: 28px; }
            #colorblindToggle::before { font-size: 13px; }
            
            .main-content { padding: 70px 16px 32px 16px; }
            .welcome-box h1 { font-size: 28px; }
            .welcome-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
        .feedback-btn{position:fixed;right:28px;bottom:28px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#4da1ff);color:#fff;border:none;cursor:pointer;font-size:26px;box-shadow:0 4px 20px rgba(87,195,255,.4);transition:all .3s;z-index:9999;display:flex;align-items:center;justify-content:center;text-decoration:none}
        .feedback-btn:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(87,195,255,.5)}
        @media (max-width: 768px) {
            .feedback-btn{width:52px;height:52px;font-size:22px;right:18px;bottom:18px}
        }
    </style>
<script src="common.js"></script>
</head>

    <script>
        const T = {
            'nav-home': { zh:'主页', 'zh-tw':'主頁', en:'Home' },
            'nav-intro': { zh:'Furry (兽迷文化)', 'zh-tw':'Furry (獸迷文化)', en:'Furry (Furry Fandom)' },

            'nav-coninfo': { zh:'兽聚信息', 'zh-tw':'獸聚資訊', en:'Con Info' },

            'nav-calendar': { zh:'兽聚日期', 'zh-tw':'獸聚日期', en:'Con Calendar' },

            'nav-gallery': { zh:'绘画作品', 'zh-tw':'繪畫作品', en:'Art Gallery' },
            'nav-bilibili': { zh:'B站UP主', 'zh-tw':'B站UP主', en:'Bilibili UP' },
            'nav-terminology': { zh:'术语', 'zh-tw':'術語', en:'Terminology' },
            'nav-chat': { zh:'群聊', 'zh-tw':'群聊', en:'Chat Groups' },
            'nav-contribute': { zh:'编辑', 'zh-tw':'編輯', en:'Edit' },
            'nav-about': { zh:'关于', 'zh-tw':'關於', en:'About' },
            'home-title': { zh:'欢迎来到新福瑞Wiki！', 'zh-tw':'歡迎來到新福瑞Wiki！', en:'Welcome to the New FurryWiki!' },
            'home-desc': { zh:'探索毛茸茸的世界，了解福瑞文化的方方面面。<br>从左侧导航栏选择你感兴趣的内容开始探索吧~', 'zh-tw':'探索毛茸茸的世界，了解福瑞文化的方方面面。<br>从左侧导航栏选择你感兴趣的内容开始探索吧~', en:'Explore the fluffy world and learn all about Furry culture.<br>Choose a topic from the left navigation to start exploring~' },
            'card-intro': { zh:'兽迷文化', 'zh-tw':'獸迷文化', en:'Furry Culture' },
            'card-history': { zh:'历史', 'zh-tw':'歷史', en:'History' },
            'card-gallery': { zh:'绘画作品', 'zh-tw':'繪畫作品', en:'Art Gallery' },

            'card-calendar': { zh:'兽聚日期', 'zh-tw':'獸聚日期', en:'Con Calendar' },
        };

        function updatePageLang(lang) {
            document.getElementById('home-title').textContent = T['home-title'][lang];
            document.getElementById('home-desc').innerHTML = T['home-desc'][lang];
            for(let key in T){
                if(key.startsWith('card-')){
                    const el = document.getElementById(key);
                    if(el) el.textContent = T[key][lang];
                }
            }
        }
        updatePageLang(localStorage.getItem('lang') || 'zh');
    </script>
