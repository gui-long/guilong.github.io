    <script>
        var WORK = {"editor":"茶花诗意在黄昏时分","name":"九子不成龙","author":"载水 / 呆鸭屋","group":"myth","link":"https://manga.bilibili.com/m/detail/mc29441?from=bili_search_card&from_spmid=search.search-result.0.0","desc":"龙生九子，各不成器。","cat":"新中式神话校园喜剧条漫。","bg":"载水（原著）是北京呆鸭屋文化传播有限公司创始人，香港城市大学创意媒体硕士、中国传媒大学戏剧影视文学学士，参与过《长江七号：超萌特攻队》《猫和老鼠》《功夫小子》等项目，也曾参与新版《天书奇谈》与《黑猫警长》的开发。呆鸭屋工作室（编绘）成立于2020年4月，核心业务包括影视动漫前中期开发和IP孵化。","intro":"龙生九子，性格迥异，因不务正业、惹是生非，被龙君赶到人间\"再教育\"。九位龙子被安排进入凡间的学校，根据各自的性格和爱好进入不同院系和社团，但受神龙岛规定约束不能向凡人暴露身份。由于对现代人类社会常识缺乏，他们经常陷入需要遮掩的搞笑麻烦中。核心看点是\"帅气人型与可爱毛茸茸兽型一秒切换\"的设定，以及兄弟情和校园群像。"};
