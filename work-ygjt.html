    <script>
        var WORK = {"editor":"茶花诗意在黄昏时分","name":"鱼干集团那些事","author":"灰渊（众兽逐梦工作室）","group":"cn","link":"https://www.bilibili.com/video/BV1VD421u7cy","desc":"一名学生穿越福瑞世界的事情。","cat":"原创兽剧动画（B站播出），衍生视觉小说游戏《鱼干集团那些事：征途》开发中，预计2027年第一季度发行。","bg":"由兽圈爱好者团队\"众兽逐梦工作室\"自制的原创动画，制作人灰渊（主角与其同名，带有\"代入感\"创作色彩），技术合作\"不会摄影的严同学\"，音乐合作Taraku。这个IP已积累了超过两年的粉丝等待，衍生游戏被定位为\"写给粉丝的、可以参与的情书\"。","intro":"主角灰渊意外被一块旧手表拉入一个遍地毛茸茸兽人的科幻世界，结识了鱼干科技集团的瑞晨、森白等朋友。这个世界依靠\"星石精灵\"的能量飞速发展，但\"掌控者组织\"盗走了终极星石，导致星石精灵全部失控，世界的故事似乎陷入停滞循环。灰渊的手表是唯一还在跳动的异物，而屏幕外的\"观测者\"（玩家/观众）通过手表介入这个世界，推动故事继续。"};
